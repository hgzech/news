<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Psych Daily</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a18;
    --paper: #f5f0e8;
    --rule: #c4b9a4;
    --faded: #6b6152;
    --accent: #8b2500;
    --highlight: #fffbe6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    color-scheme: only light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8e0d0;
      --paper: #1c1a17;
      --rule: #3d3729;
      --faded: #9a8e7d;
      --accent: #d4845a;
      --highlight: rgba(255, 251, 230, 0.06);
    }
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .masthead {
    text-align: center;
    padding: 1.5rem 1rem 0.8rem;
    border-bottom: 3px double var(--ink);
    position: relative;
  }

  .masthead::before {
    content: '';
    display: block;
    height: 2px;
    background: var(--ink);
    margin-bottom: 0.6rem;
  }

  .masthead h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: clamp(2rem, 7vw, 3.2rem);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .masthead .tagline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--faded);
    margin-top: 0.25rem;
  }

  .toolbar {
    display: flex;
    justify-content: center;
    gap: 0.6rem;
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--rule);
    flex-wrap: wrap;
  }

  .toolbar button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--rule);
    color: var(--faded);
    padding: 0.3rem 0.7rem;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .toolbar button:hover {
    border-color: var(--faded);
    color: var(--ink);
  }

  .toolbar button.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .feed {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 1rem 3rem;
  }

  .article {
    border-bottom: 1px solid var(--rule);
    padding: 1.2rem 0;
    cursor: pointer;
    transition: background 0.15s;
  }

  .article:hover {
    background: var(--highlight);
    margin: 0 -0.5rem;
    padding-left: 0.5rem;
    padding-right: 0.5rem;
  }

  .article .date-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.3rem;
  }

  .feed-star {
    opacity: 0.7;
  }

  .article h2 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 1.15rem;
    line-height: 1.3;
    margin-bottom: 0.3rem;
  }

  .article .lede {
    font-size: 0.9rem;
    color: var(--faded);
    line-height: 1.45;
  }

  .article.read h2 {
    color: var(--faded);
    font-weight: 400;
  }

  .article.read .date-tag::after {
    content: ' · ✓';
    opacity: 0.45;
  }

  .article-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .star-icon-btn {
    font-size: 1.5rem;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--faded);
    padding: 0.4rem 0.2rem;
    line-height: 1;
    transition: color 0.15s, transform 0.15s;
  }
  .star-icon-btn:hover { color: var(--accent); transform: scale(1.15); }
  .star-icon-btn.starred { color: var(--accent); }

  .unread-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: none;
    border: none;
    color: var(--faded);
    cursor: pointer;
    padding: 0.4rem 0;
    opacity: 0.55;
    transition: opacity 0.15s, color 0.15s;
  }
  .unread-btn:hover { opacity: 1; color: var(--ink); }
  .unread-btn.done { color: var(--accent); opacity: 1; cursor: default; }

  /* Expanded article view */
  .article-full {
    display: none;
    max-width: 640px;
    margin: 0 auto;
    padding: 1rem 1rem 3rem;
  }

  .article-full.visible {
    display: block;
  }

  .feed.hidden {
    display: none;
  }

  .back-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    padding: 0.8rem 0;
    display: inline-block;
  }

  .back-btn:hover { text-decoration: underline; }

  .article-full .category-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-top: 0.8rem;
    margin-bottom: 0.3rem;
  }

  .article-full h2 {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: clamp(1.4rem, 5vw, 1.8rem);
    line-height: 1.25;
    margin-bottom: 0.4rem;
  }

  .article-full .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--faded);
    letter-spacing: 0.05em;
    padding-bottom: 0.8rem;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 1rem;
  }

  .article-full .body {
    font-size: 0.95rem;
    line-height: 1.7;
  }

  .article-full .body p {
    margin-bottom: 1rem;
    text-align: justify;
    hyphens: auto;
  }

  .article-full .body p:first-child::first-letter {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 3.2em;
    float: left;
    line-height: 0.8;
    margin: 0.05em 0.08em 0 0;
    color: var(--accent);
  }

  .article-full .sidebar-quote {
    border-left: 3px solid var(--accent);
    padding: 0.6rem 0 0.6rem 1rem;
    margin: 1.2rem 0;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--faded);
    line-height: 1.5;
  }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--faded);
    font-style: italic;
    display: none;
  }

  .footer-rule {
    max-width: 640px;
    margin: 0 auto;
    border: none;
    border-top: 3px double var(--ink);
    padding: 0 1rem;
  }

  .footer-text {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.55rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--faded);
    padding: 0.6rem;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .article { animation: fadeIn 0.3s ease both; }
  .article:nth-child(2) { animation-delay: 0.04s; }
  .article:nth-child(3) { animation-delay: 0.08s; }
  .article:nth-child(4) { animation-delay: 0.12s; }
  .article:nth-child(5) { animation-delay: 0.16s; }
  .article:nth-child(6) { animation-delay: 0.2s; }

  .article-full.visible {
    animation: fadeIn 0.25s ease both;
  }
</style>
</head>
<body>

<header class="masthead">
  <h1>The Psych Daily</h1>
  <div class="tagline">All the mind's news, eventually</div>
</header>

<nav class="toolbar" id="era-toolbar"></nav>

<main class="feed" id="feed"></main>
<div class="empty-state" id="empty">No dispatches in this section.</div>
<div class="article-full" id="article-full"></div>

<hr class="footer-rule">
<div class="footer-text">A healthier bathroom read · Est. whenever you opened this</div>

<script>
let allArticles = [];
let filteredShuffled = [];
let renderedCount = 0;
const PAGE_SIZE = 10;
let activeEra = null;
let hideRead = false;
let showStarred = false;
let savedScrollY = 0;
let lastOpenedId = null;

function getReadSet() {
  try { return new Set(JSON.parse(localStorage.getItem('readArticles') || '[]')); }
  catch { return new Set(); }
}

function markRead(id) {
  const set = getReadSet();
  if (set.has(id)) return;
  set.add(id);
  localStorage.setItem('readArticles', JSON.stringify([...set]));
}

function markUnread(id) {
  const set = getReadSet();
  set.delete(id);
  localStorage.setItem('readArticles', JSON.stringify([...set]));
  const btn = document.getElementById('unread-btn');
  if (btn) { btn.textContent = '✓ marked unread'; btn.classList.add('done'); }
}

function getStarSet() {
  try { return new Set(JSON.parse(localStorage.getItem('starredArticles') || '[]')); }
  catch { return new Set(); }
}

function toggleStar(id) {
  const set = getStarSet();
  set.has(id) ? set.delete(id) : set.add(id);
  localStorage.setItem('starredArticles', JSON.stringify([...set]));
  return set.has(id);
}

function parseYear(dateStr) {
  const m = String(dateStr).match(/\d{4}/);
  return m ? parseInt(m[0], 10) : null;
}

function matchesEra(article, era) {
  if (!era) return true;
  const y = parseYear(article.date);
  if (y === null) return false;
  if (era === 'before-1900') return y < 1900;
  if (era === '1900-1950') return y >= 1900 && y <= 1950;
  if (era === '1950-2000') return y > 1950 && y <= 2000;
  if (era === 'after-2000') return y > 2000;
  return true;
}

async function loadArticles() {
  const manifest = await fetch('data/manifest.json').then(r => r.json());
  const batches = await Promise.all(manifest.map(f => fetch('data/' + f).then(r => r.json())));
  allArticles = batches.flatMap(b => b.articles.map(a => ({
    ...a,
    source: b.source,
    cat: a.cat || (a.era ? [a.era] : ['Psychology']),
    quote: a.quote || ''
  })));
  renderEraToolbar();
  applyFiltersAndRender();
}

function renderEraToolbar() {
  const tb = document.getElementById('era-toolbar');
  tb.innerHTML = '';
  const eras = [
    { label: 'Before 1900', value: 'before-1900' },
    { label: '1900–1950', value: '1900-1950' },
    { label: '1950–2000', value: '1950-2000' },
    { label: 'After 2000', value: 'after-2000' },
  ];

  eras.forEach(({ label, value }) => {
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.onclick = () => {
      if (activeEra === value) {
        activeEra = null;
        btn.classList.remove('active');
        btn.blur();
      } else {
        activeEra = value;
        document.querySelectorAll('#era-toolbar button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      applyFiltersAndRender();
    };
    tb.appendChild(btn);
  });

  const hideBtn = document.createElement('button');
  hideBtn.id = 'hide-read-btn';
  hideBtn.textContent = 'Hide read';
  hideBtn.onclick = () => {
    hideRead = !hideRead;
    hideBtn.classList.toggle('active', hideRead);
    applyFiltersAndRender();
  };
  tb.appendChild(hideBtn);

  const starBtn = document.createElement('button');
  starBtn.id = 'starred-filter-btn';
  starBtn.textContent = '★ Starred';
  starBtn.onclick = () => {
    showStarred = !showStarred;
    starBtn.classList.toggle('active', showStarred);
    if (showStarred) { hideRead = false; document.getElementById('hide-read-btn').classList.remove('active'); }
    applyFiltersAndRender();
  };
  tb.appendChild(starBtn);
}

function applyFiltersAndRender() {
  const feed = document.getElementById('feed');
  const full = document.getElementById('article-full');
  const empty = document.getElementById('empty');

  full.classList.remove('visible');
  feed.classList.remove('hidden');

  const readSet = getReadSet();
  const starSet = getStarSet();
  const filtered = allArticles.filter(a =>
    matchesEra(a, activeEra) &&
    !(hideRead && readSet.has(a.id)) &&
    !(showStarred && !starSet.has(a.id))
  );

  filteredShuffled = [...filtered].sort(() => Math.random() - 0.5);
  renderedCount = 0;
  feed.innerHTML = '';
  window.scrollTo({ top: 0 });

  if (filteredShuffled.length === 0) {
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    renderMore();
  }
}

function renderMore() {
  const feed = document.getElementById('feed');
  const slice = filteredShuffled.slice(renderedCount, renderedCount + PAGE_SIZE);
  const readSet = getReadSet();
  const starSet = getStarSet();
  slice.forEach((a, i) => {
    const div = document.createElement('div');
    div.className = 'article' + (readSet.has(a.id) ? ' read' : '');
    div.style.animationDelay = `${i * 0.04}s`;
    div.innerHTML = `
      <div class="date-tag">${a.cat.join(' · ')} · ${a.date}${starSet.has(a.id) ? ' <span class="feed-star">★</span>' : ''}</div>
      <h2>${a.title}</h2>
      <div class="lede">${a.lede}</div>
    `;
    div.dataset.articleId = a.id;
    div.onclick = () => openArticle(a);
    feed.appendChild(div);
  });
  renderedCount += slice.length;
}

window.addEventListener('scroll', () => {
  if (renderedCount >= filteredShuffled.length) return;
  if (document.getElementById('article-full').classList.contains('visible')) return;
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
    renderMore();
  }
});

function closeFull() {
  const feed = document.getElementById('feed');
  const full = document.getElementById('article-full');
  full.classList.remove('visible');
  feed.classList.remove('hidden');
  document.querySelector('.masthead').style.display = '';
  document.getElementById('era-toolbar').style.display = '';
  if (lastOpenedId) {
    const card = feed.querySelector(`[data-article-id="${lastOpenedId}"]`);
    if (card) {
      if (getReadSet().has(lastOpenedId)) {
        card.classList.add('read');
      } else {
        card.classList.remove('read');
      }
      const dateTag = card.querySelector('.date-tag');
      if (dateTag) {
        const isStarred = getStarSet().has(lastOpenedId);
        const existing = dateTag.querySelector('.feed-star');
        if (isStarred && !existing) {
          dateTag.insertAdjacentHTML('beforeend', ' <span class="feed-star">★</span>');
        } else if (!isStarred && existing) {
          existing.remove();
        }
      }
    }
  }
  window.scrollTo({ top: savedScrollY });
}

function openArticle(a) {
  markRead(a.id);
  lastOpenedId = a.id;
  savedScrollY = window.scrollY;
  const feed = document.getElementById('feed');
  const full = document.getElementById('article-full');

  document.querySelector('.masthead').style.display = 'none';
  document.getElementById('era-toolbar').style.display = 'none';
  feed.classList.add('hidden');
  const starred = getStarSet().has(a.id);
  full.innerHTML = `
    <div class="article-top-bar">
      <button class="back-btn" onclick="closeFull()">← Back to feed</button>
      <button class="unread-btn" id="unread-btn" onclick="markUnread('${a.id}')">mark unread</button>
      <button class="star-icon-btn${starred ? ' starred' : ''}" id="star-btn" onclick="
        const isNow = toggleStar('${a.id}');
        this.textContent = isNow ? '★' : '☆';
        this.classList.toggle('starred', isNow);
      ">${starred ? '★' : '☆'}</button>
    </div>
    <div class="category-label">${a.cat.join(' · ')}</div>
    <h2>${a.title}</h2>
    <div class="meta">${a.date} · ${a.source}</div>
    <div class="body">
      ${a.body.split('\n\n').map(p => `<p>${p}</p>`).join('')}
      ${a.quote ? `<div class="sidebar-quote">${a.quote}</div>` : ''}
    </div>
  `;
  full.classList.add('visible');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

loadArticles();
</script>

</body>
</html>
